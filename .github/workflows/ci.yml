name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No key anywhere: nothing in the tests may reach OpenAI.
      - run: npm test
        env:
          OPENAI_API_KEY: ''
          KAIWA_DATA_DIR: ${{ runner.temp }}/kaiwa-data
